name: Actualizar datos de CELEC Sur

on:
  schedule:
    # Cada hora, al minuto 20 (GitHub usa hora UTC; Ecuador es UTC-5).
    # Para una sola vez al día, cambie la línea por:  - cron: "20 23 * * *"   (18:20 en Ecuador)
    - cron: "20 * * * *"
  workflow_dispatch: {}   # botón "Run workflow" para actualizar a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos de CELEC Sur
        run: python scripts/actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos CELEC Sur $(TZ=America/Guayaquil date '+%d/%m/%Y %H:%M')"
            git push
          fi
